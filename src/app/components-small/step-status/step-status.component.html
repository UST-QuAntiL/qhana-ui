<div class="step-status">
  @if (isPending && spinner > 1) {
    <mat-spinner color="primary" mode="indeterminate" [diameter]="spinner"
      aria-hidden="true">
    </mat-spinner>
  }
  @if (isSuccess) {
    <mat-icon color="primary" inline="true" aria-hidden="true">done</mat-icon>
  }
  @if (isError) {
    <mat-icon inline="true" aria-hidden="true">error</mat-icon>
  }
  @if (!noText) {
    <span>{{status}}</span>
  }
</div>
