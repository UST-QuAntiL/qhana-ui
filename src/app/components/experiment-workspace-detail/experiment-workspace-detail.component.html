<div class="content-container">
    <div class="title">
        <h1 class="t-page-headline">Template: {{templateObject?.name}}</h1>
    </div>

    <mat-card appearance="outlined">
        <div class="card-header">
            <h2>Template Details</h2>
        </div>
        <mat-card-content>
            <p>Name: {{templateObject?.name}}</p>
            <p>Description: {{templateObject?.description}}</p>
            <p>Tags:</p>
            <mat-chip-listbox>
                @for (tag of templateObject?.tags; track tag) {
                    <mat-chip>
                        {{tag}}
                    </mat-chip>
                }
            </mat-chip-listbox>
        </mat-card-content>
    </mat-card>

    @if (templateLink) {
        <qhana-ui-template-tab-list [templateLink]="templateLink"></qhana-ui-template-tab-list>
    }
</div>
